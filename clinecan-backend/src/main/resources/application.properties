spring.application.name=clinecan-backend
clinecan.llm.api-key=${CLINECAN_LLM_API_KEY:}
clinecan.llm.model=${CLINECAN_LLM_MODEL:gpt-4o-mini}
clinecan.llm.endpoint=${CLINECAN_LLM_ENDPOINT:https://api.openai.com/v1}
clinecan.llm.timeout-seconds=${CLINECAN_LLM_TIMEOUT_SECONDS:45}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

clinecan.sandbox.enabled=${CLINECAN_SANDBOX_ENABLED:true}
clinecan.sandbox.timeout-seconds=${CLINECAN_SANDBOX_TIMEOUT_SECONDS:90}
clinecan.sandbox.max-memory-mb=${CLINECAN_SANDBOX_MAX_MEMORY_MB:512}
clinecan.sandbox.max-cpus=${CLINECAN_SANDBOX_MAX_CPUS:1}
clinecan.sandbox.max-concurrent=${CLINECAN_SANDBOX_MAX_CONCURRENT:2}
clinecan.sandbox.image=${CLINECAN_SANDBOX_IMAGE:clinecan-sandbox:phase3}
clinecan.repair.max-attempts=${CLINECAN_REPAIR_MAX_ATTEMPTS:2}

# Local development only: no authentication exists in this phase.
server.address=127.0.0.1
